<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOON LAG KEY | Unknown Modz</title>

    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --card2: #0b0b0b;
            --text: #ffffff;
            --muted: #888888;
            --accent: #00ff88;
            --error: #ff4444;
            --border: #222222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* LOGO */

        .key-icon {
            background: #1a1a1a;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 20px;

            border: 1px solid #333;

            overflow: hidden;

            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.10);
        }

        .key-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 30px;
        }

        /* MAIN CARD */

        .card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 28px;

            padding: 30px;

            text-align: center;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.6);
        }

        h2 {
            font-size: 22px;
            margin: 0 0 8px;

            color: var(--accent);

            font-weight: 700;
        }

        .card-p {
            color: #999999;
            font-size: 14px;
            line-height: 1.6;

            margin: 0 0 25px;
        }

        /* LABEL */

        .label {
            display: block;

            text-align: left;

            color: #aaaaaa;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1px;

            margin: 18px 0 8px;
        }

        /* INPUT */

        .input {
            width: 100%;

            padding: 16px;

            background: #000000;

            color: #ffffff;

            border: 1px solid #333333;

            border-radius: 14px;

            font-size: 16px;

            outline: none;

            text-align: center;
        }

        .input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 12px rgba(0, 255, 136, 0.10);
        }

        /* SELECT */

        .select {
            width: 100%;

            padding: 16px;

            background: #000000;

            color: #ffffff;

            border: 1px solid #333333;

            border-radius: 14px;

            font-size: 16px;

            outline: none;

            cursor: pointer;
        }

        .select:focus {
            border-color: var(--accent);
        }

        /* GENERATE BUTTON */

        .btn {
            width: 100%;

            padding: 18px;

            margin-top: 25px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 16px;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition:
                0.25s ease;
        }

        .btn:hover {
            transform: scale(1.02);

            background: var(--accent);

            box-shadow:
                0 10px 25px rgba(0, 255, 136, 0.20);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* RESULT */

        #resultContainer {
            display: none;

            margin-top: 25px;
        }

        .result-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }

        .result-title {
            color: var(--accent);

            font-size: 16px;

            font-weight: 800;
        }

        .expiry {
            color: #777777;

            font-size: 11px;

            text-align: right;
        }

        /* KEY LIST */

        .key-list {
            background: #000000;

            border: 1px solid #222222;

            border-radius: 18px;

            padding: 10px;

            max-height: 350px;

            overflow-y: auto;

            text-align: left;
        }

        .key-row {
            display: flex;

            align-items: center;

            gap: 10px;

            padding: 12px;

            border-bottom: 1px solid #1c1c1c;
        }

        .key-row:last-child {
            border-bottom: none;
        }

        .key-number {
            color: #555555;

            font-size: 11px;

            min-width: 20px;
        }

        .key-text {
            color: var(--accent);

            font-family: "Courier New", monospace;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 0.5px;

            flex: 1;

            word-break: break-all;
        }

        .copy-small {
            background: #181818;

            color: #ffffff;

            border: 1px solid #333333;

            border-radius: 9px;

            padding: 8px 10px;

            font-size: 10px;

            font-weight: 700;

            cursor: pointer;
        }

        .copy-small:hover {
            background: var(--accent);

            color: #000000;
        }

        /* COPY ALL */

        .copy-all {
            margin-top: 15px;

            background: var(--accent);

            color: #000000;
        }

        .copy-all:hover {
            background: #ffffff;

            box-shadow:
                0 10px 25px rgba(0, 255, 136, 0.20);
        }

        /* CLEAR */

        .clear-btn {
            margin-top: 10px;

            background: transparent;

            color: #777777;

            border: 1px solid #292929;
        }

        .clear-btn:hover {
            background: #171717;

            color: #ffffff;

            box-shadow: none;
        }

        /* FOOTER */

        .footer {
            margin-top: 50px;

            color: #333333;

            font-size: 10px;

            letter-spacing: 2px;

            text-transform: uppercase;

            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 400px) {

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .key-text {
                font-size: 11px;
            }

            .copy-small {
                padding: 7px 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <div class="key-icon">
        <img src="./assets/logo.png" alt="MOON LAG">
    </div>

    <h1>MOON LAG KEY</h1>

    <p class="subtitle">
        Private License Key Generator
    </p>


    <!-- GENERATOR CARD -->

    <div class="card">

        <h2>Generate Keys</h2>

        <p class="card-p">
            Create temporary license keys with a selected validity period.
        </p>


        <!-- NUMBER OF KEYS -->

        <label class="label" for="keyCount">
            NUMBER OF KEYS
        </label>

        <input
            class="input"
            id="keyCount"
            type="number"
            min="1"
            max="1000"
            value="10"
            placeholder="Enter number of keys"
        >


        <!-- EXPIRY -->

        <label class="label" for="duration">
            KEY DURATION
        </label>

        <select
            class="select"
            id="duration"
        >
            <option value="1">1 Hour</option>
            <option value="2">2 Hours</option>
            <option value="24" selected>24 Hours</option>
        </select>


        <!-- GENERATE -->

        <button
            class="btn"
            onclick="generateKeys()"
        >
            GENERATE KEYS
        </button>


        <!-- RESULTS -->

        <div id="resultContainer">

            <div class="result-header">

                <div class="result-title">
                    GENERATED KEYS
                </div>

                <div
                    class="expiry"
                    id="expiryText"
                >
                    -
                </div>

            </div>


            <div
                class="key-list"
                id="keyList"
            >
            </div>


            <button
                class="btn copy-all"
                onclick="copyAllKeys()"
            >
                COPY ALL KEYS
            </button>


            <button
                class="btn clear-btn"
                onclick="clearKeys()"
            >
                CLEAR
            </button>

        </div>

    </div>


    <div class="footer">
        UNKNOWN MODZ SECURITY SYSTEM
    </div>

</div>


<script>

    /*
     * ==========================================
     * MOON LAG KEY GENERATOR
     * ==========================================
     *
     * Current key format:
     *
     * UKM-XXXX-XXXX-XXXX-XXXX
     *
     * Supported durations:
     *
     * 1 Hour
     * 2 Hours
     * 24 Hours
     *
     * ==========================================
     */


    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    /*
     * Generate random characters
     */

    function randomChars(length) {

        let result = "";

        const randomValues =
            new Uint32Array(length);

        crypto.getRandomValues(randomValues);

        for (let i = 0; i < length; i++) {

            result += chars.charAt(
                randomValues[i] % chars.length
            );

        }

        return result;
    }


    /*
     * Generate one UKM key
     */

    function createKey() {

        let segments = [];

        for (let i = 0; i < 4; i++) {

            segments.push(
                randomChars(4)
            );

        }

        return "UKM-" + segments.join("-");

    }


    /*
     * Generate multiple keys
     */

    function generateKeys() {

        const countInput =
            document.getElementById("keyCount");

        const durationSelect =
            document.getElementById("duration");


        let count =
            parseInt(countInput.value);

        const duration =
            parseInt(durationSelect.value);


        /*
         * Validate number
         */

        if (
            isNaN(count) ||
            count < 1
        ) {

            alert(
                "Please enter a valid number of keys."
            );

            return;
        }


        /*
         * Limit generation
         */

        if (count > 1000) {

            count = 1000;

            countInput.value = 1000;

        }


        /*
         * Calculate expiry
         */

        const generatedAt =
            Date.now();

        const expiryTime =
            generatedAt +
            (duration * 60 * 60 * 1000);


        /*
         * Create keys
         */

        const keys = [];

        for (let i = 0; i < count; i++) {

            keys.push(
                createKey()
            );

        }


        /*
         * Display list
         */

        const keyList =
            document.getElementById("keyList");

        keyList.innerHTML = "";


        keys.forEach(
            function(key, index) {

                const row =
                    document.createElement("div");

                row.className =
                    "key-row";


                const number =
                    document.createElement("span");

                number.className =
                    "key-number";

                number.innerText =
                    (index + 1) + ".";


                const keyText =
                    document.createElement("span");

                keyText.className =
                    "key-text";

                keyText.innerText =
                    key;


                const copyButton =
                    document.createElement("button");

                copyButton.className =
                    "copy-small";

                copyButton.innerText =
                    "COPY";


                copyButton.onclick =
                    function() {

                        copySingleKey(
                            key,
                            copyButton
                        );

                    };


                row.appendChild(number);

                row.appendChild(keyText);

                row.appendChild(copyButton);

                keyList.appendChild(row);

            }
        );


        /*
         * Format expiry time
         */

        const expiryDate =
            new Date(expiryTime);


        const expiryString =
            expiryDate.toLocaleString();


        document.getElementById(
            "expiryText"
        ).innerText =
            "Expires: " + expiryString;


        /*
         * Show result
         */

        document.getElementById(
            "resultContainer"
        ).style.display = "block";


        /*
         * Store current generated data
         * only for Copy All.
         */

        window.generatedKeys =
            keys;

        window.generatedExpiry =
            expiryTime;

    }


    /*
     * Copy one key
     */

    function copySingleKey(
        key,
        button
    ) {

        navigator.clipboard
            .writeText(key)
            .then(
                function() {

                    const oldText =
                        button.innerText;

                    button.innerText =
                        "COPIED";

                    setTimeout(
                        function() {

                            button.innerText =
                                oldText;

                        },
                        1500
                    );

                }
            )
            .catch(
                function() {

                    alert(
                        "Clipboard access failed."
                    );

                }
            );

    }


    /*
     * Copy all generated keys
     */

    function copyAllKeys() {

        if (
            !window.generatedKeys ||
            window.generatedKeys.length === 0
        ) {

            return;

        }


        const text =
            window.generatedKeys.join("\n");


        navigator.clipboard
            .writeText(text)
            .then(
                function() {

                    const button =
                        document.querySelector(
                            ".copy-all"
                        );

                    const oldText =
                        button.innerText;


                    button.innerText =
                        "COPIED SUCCESSFULLY! ✅";


                    setTimeout(
                        function() {

                            button.innerText =
                                oldText;

                        },
                        2000
                    );

                }
            )
            .catch(
                function() {

                    alert(
                        "Clipboard access failed."
                    );

                }
            );

    }


    /*
     * Clear generated keys
     */

    function clearKeys() {

        document.getElementById(
            "keyList"
        ).innerHTML = "";


        document.getElementById(
            "resultContainer"
        ).style.display = "none";


        window.generatedKeys =
            [];


        window.generatedExpiry =
            null;

    }

</script>

</body>
    </html>
