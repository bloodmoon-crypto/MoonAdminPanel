<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UKM | Master Admin</title>
    <style>
        :root { --bg: #050505; --card: #111111; --text: #ffffff; --accent: #ff3366; --success: #00ff88; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; background-image: radial-gradient(circle at 50% 0%, #1a0a0a 0%, #050505 70%); }
        .container { width: 100%; max-width: 450px; text-align: center; }
        .logo-box { width: 90px; height: 90px; margin: 0 auto 20px; border-radius: 50%; background: #111; border: 2px solid var(--accent); display: flex; justify-content: center; align-items: center; overflow: hidden; box-shadow: 0 0 30px rgba(255, 51, 102, 0.2); }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #666; font-size: 12px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 40px 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
        .btn { width: 100%; padding: 18px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #fff; color: #000; box-shadow: 0 0 30px rgba(255,255,255,0.3); }
        .key-box { display: none; background: #000; padding: 25px 20px; border-radius: 12px; border: 1px dashed var(--success); margin-top: 25px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .key-label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        #finalKey { color: var(--success); font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; letter-spacing: 2px; word-wrap: break-word; }
        #daySeed { color: #ff3366; font-family: 'Courier New', monospace; font-size: 14px; margin-top: 15px; font-weight: bold; }
        .copy-btn { background: transparent; border: 1px solid #333; color: #aaa; padding: 12px; border-radius: 8px; width: 100%; margin-top: 15px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .copy-btn:hover { background: #222; color: #fff; }
        .footer { margin-top: 40px; color: #333; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-box">
        <img src="./assets/logo.png" alt="UKM" onerror="this.src='https://via.placeholder.com/90/111/ff3366?text=UKM'">
    </div>
    <h1>Master Override</h1>
    <p class="subtitle">Universal Time-Lock Generator</p>
    <div class="card">
        <button class="btn" id="genBtn" onclick="generateMasterKey()">Generate VIP Key</button>
        <div class="key-box" id="keyBox">
            <div class="key-label">VIP Access Key</div>
            <div id="finalKey">WAITING...</div>
            <div id="daySeed">Day Seed: 0</div>
            <button class="copy-btn" onclick="copyKey()">COPY TO CLIPBOARD</button>
        </div>
    </div>
    <div class="footer">UKM SECURE ADMIN SYSTEM</div>
</div>
<script>
    function generateMasterKey() {
        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        btn.innerText = "GENERATING...";

        setTimeout(() => {
            try {
                // UTC Days since epoch
                const day = Math.floor(Date.now() / 86400000);
                let state = day + 0x270F; // 9999 Salt
                
                const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                let result = "VIP-";

                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        // Exact 32-bit LCG
                        state = (Math.imul(state, 0x41C64E6D) + 0x3039) & 0x7FFFFFFF;
                        let idx = state % 32;
                        result += chars.charAt(idx);
                    }
                    if (i < 3) result += "-";
                }

                document.getElementById('finalKey').innerText = result;
                document.getElementById('daySeed').innerText = "Day Seed: " + day;
                document.getElementById('keyBox').style.display = "block";
                btn.innerText = "KEY GENERATED";
            } catch (e) {
                document.getElementById('finalKey').innerText = "MATH ERROR";
                btn.disabled = false;
                btn.innerText = "TRY AGAIN";
            }
        }, 1000);
    }

    function copyKey() {
        const keyText = document.getElementById('finalKey').innerText;
        if (keyText === "WAITING...") return;
        navigator.clipboard.writeText(keyText).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "COPIED! ✅";
            btn.style.color = "#00ff88";
            btn.style.borderColor = "#00ff88";
            setTimeout(() => { btn.innerText = "COPY TO CLIPBOARD"; btn.style.color = "#aaa"; btn.style.borderColor = "#333"; }, 2000);
        });
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
