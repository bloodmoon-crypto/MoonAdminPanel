function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64ToBuf(DATA.salt), iterations: 200000, hash:'SHA-256' },
      keyMaterial,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );
    const plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: b64ToBuf(DATA.iv) },
      key,
      b64ToBuf(DATA.ct)
    );
    const html = new TextDecoder().decode(plain);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').innerHTML = html;
    // Also re-execute any <script> tags (innerHTML doesn't run them)
    document.querySelectorAll('#app script').forEach(old => {
      const s = document.createElement('script');
      [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  } catch(e){
    err.textContent = 'Wrong password or corrupted file.';
  }
}
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});
</script>
</body>
