<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOON LAG VIP | Master Admin</title>

    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --text: #ffffff;
            --accent: #ff3366;
            --success: #00ff88;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(
                circle at 50% 0%, #1a0a0a 0%, #050505 70%
            );
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #111;
            border: 2px solid var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.2);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background: var(--card);
            border: 1px solid #222;
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(
                90deg, transparent, var(--accent), transparent
            );
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 10px;
            text-transform: uppercase;
        }

        .section-description {
            color: #666;
            font-size: 12px;
            margin: 0 0 25px;
        }

        .password-wrap {
            position: relative;
            margin-bottom: 15px;
        }

        .password-input {
            width: 100%;
            padding: 17px 48px 17px 16px;
            background: #080808;
            color: #fff;
            border: 1px solid #333;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            font-family: monospace;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .password-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.12);
        }

        .password-input::placeholder {
            color: #555;
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 17px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            color: var(--accent);
            font-size: 12px;
            margin: 0 0 15px;
        }

        .success-message {
            color: var(--success);
            font-size: 12px;
            margin: 0 0 20px;
        }

        #adminPanel {
            display: none;
        }

        .panel-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .panel-top .section-title {
            margin: 0;
            text-align: left;
        }

        .logout-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .logout-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .key-box {
            display: none;
            background: #000;
            padding: 25px 20px;
            border-radius: 12px;
            border: 1px dashed var(--success);
            margin-top: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .key-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #finalKey {
            color: var(--success);
            font-family: 'Courier New', monospace;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
        }

        .timer {
            display: none;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
            font-family: monospace;
        }

        .timer span {
            color: var(--accent);
            font-weight: bold;
            font-size: 15px;
        }

        .timer-note {
            color: #555;
            font-size: 10px;
            margin-top: 8px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: #222;
            color: #fff;
        }

        .footer {
            margin-top: 35px;
            color: #333;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 23px;
            }

            #finalKey {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="logo-box">
        <img
            src="./assets/logo.png"
            alt="UKM"
            onerror="this.onerror=null;this.src='https://via.placeholder.com/90/111/ff3366?text=UKM'"
        >
    </div>

    <h1>MOON LAG VIP</h1>
    <p class="subtitle">Universal Key Generator</p>

    <!-- PASSWORD LOGIN -->
    <section class="card" id="loginPanel">
        <h2 class="section-title">Admin Access</h2>
        <p class="section-description">
            Enter your administrator password to continue.
        </p>

        <form id="loginForm">
            <div class="password-wrap">
                <input
                    class="password-input"
                    id="adminPassword"
                    type="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                    aria-label="Admin password"
                >

                <button
                    class="eye-btn"
                    type="button"
                    id="togglePassword"
                    aria-label="Show password"
                >◉</button>
            </div>

            <p class="error-message" id="loginError" role="alert">
                ACCESS DENIED — INCORRECT PASSWORD
            </p>

            <button class="btn" type="submit">
                UNLOCK ADMIN PANEL
            </button>
        </form>
    </section>

    <!-- ADMIN PANEL -->
    <section class="card" id="adminPanel">
        <div class="panel-top">
            <h2 class="section-title">VIP Generator</h2>
            <button class="logout-btn" id="logoutBtn" type="button">
                LOGOUT ↗
            </button>
        </div>

        <p class="success-message">✓ ADMIN ACCESS GRANTED</p>

        <button class="btn" id="genBtn" type="button">
            GENERATE VIP KEY
        </button>

        <div class="key-box" id="keyBox">
            <div class="key-label">VIP Access Key</div>
            <div id="finalKey">WAITING...</div>

            <button class="copy-btn" id="copyBtn" type="button">
                COPY TO CLIPBOARD
            </button>
        </div>

        <div class="timer" id="timerBox">
            TIME REMAINING<br><br>
            <span id="countdown">24:00:00</span>
            <div class="timer-note">
                24-hour countdown from generation time
            </div>
        </div>
    </section>

    <div class="footer">UKM SECURE ADMIN SYSTEM</div>
</div>

<script>
    // Frontend login gate only; not server-side security.
    const ADMIN_PASSWORD = "moonxdeva";

    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("adminPassword");
    const loginError = document.getElementById("loginError");

    let timerInterval = null;
    let expiryTime = null;
    let generated = false;

    // Show/hide password
    document.getElementById("togglePassword").addEventListener(
        "click", function () {
            const showing = passwordInput.type === "text";
            passwordInput.type = showing ? "password" : "text";
            this.textContent = showing ? "◉" : "◎";
            this.setAttribute(
                "aria-label",
                showing ? "Show password" : "Hide password"
            );
        }
    );

    // Unlock admin panel
    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        if (passwordInput.value === ADMIN_PASSWORD) {
            loginError.style.display = "none";
            passwordInput.value = "";
            loginPanel.style.display = "none";
            adminPanel.style.display = "block";
        } else {
            loginError.style.display = "block";
            passwordInput.value = "";
            passwordInput.focus();
        }
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener(
        "click", function () {
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            adminPanel.style.display = "none";
            loginPanel.style.display = "block";

            generated = false;
            expiryTime = null;

            document.getElementById("genBtn").disabled = false;
            document.getElementById("genBtn").innerText =
                "GENERATE VIP KEY";

            document.getElementById("keyBox").style.display = "none";
            document.getElementById("timerBox").style.display = "none";
            document.getElementById("finalKey").innerText = "WAITING...";
            document.getElementById("countdown").innerText = "24:00:00";

            passwordInput.value = "";
            passwordInput.focus();
        }
    );

    // ORIGINAL VIP KEY-GENERATION ALGORITHM
    function generateMasterKey() {
        if (generated) return;

        const btn = document.getElementById("genBtn");
        btn.disabled = true;
        btn.innerText = "GENERATING...";

        setTimeout(() => {
            try {
                // 1. Get UTC Day Seed
                const day = Math.floor(Date.now() / 86400000);

                // 2. Add Salt
                let state = day + 0x270F;

                const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                let result = "VIP-";

                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        // Original polynomial hash
                        state = ((state * 31) + 7) & 0x7FFFFFFF;
                        let idx = state % 32;
                        result += chars.charAt(idx);
                    }

                    if (i < 3) result += "-";
                }

                document.getElementById("finalKey").innerText = result;
                document.getElementById("keyBox").style.display = "block";
                document.getElementById("timerBox").style.display = "block";

                // Exactly 24 hours from generation.
                expiryTime = Date.now() + (24 * 60 * 60 * 1000);
                generated = true;

                btn.innerText = "KEY GENERATED";
                startTimer();

            } catch (error) {
                document.getElementById("finalKey").innerText = "MATH ERROR";
                btn.disabled = false;
                btn.innerText = "TRY AGAIN";
            }
        }, 1000);
    }

    document.getElementById("genBtn").addEventListener(
        "click", generateMasterKey
    );

    // TRUE 24-HOUR COUNTDOWN
    function startTimer() {
        if (timerInterval !== null) {
            clearInterval(timerInterval);
        }

        const countdownEl = document.getElementById("countdown");

        function updateTimer() {
            const remaining = Math.max(0, expiryTime - Date.now());

            if (remaining <= 0) {
                countdownEl.innerText = "00:00:00";
                countdownEl.style.color = "#ff3366";
                clearInterval(timerInterval);
                timerInterval = null;
                return;
            }

            const totalSeconds = Math.ceil(remaining / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            countdownEl.innerText =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");

            countdownEl.style.color = "#ff3366";
        }

        updateTimer();
        timerInterval = setInterval(updateTimer, 250);
    }

    // Copy key
    document.getElementById("copyBtn").addEventListener(
        "click", async function () {
            const keyText = document.getElementById("finalKey").innerText;

            if (!generated || keyText === "WAITING...") return;

            try {
                await navigator.clipboard.writeText(keyText);
                this.innerText = "COPIED! ✓";
                this.style.color = "#00ff88";
                this.style.borderColor = "#00ff88";

                setTimeout(() => {
                    this.innerText = "COPY TO CLIPBOARD";
                    this.style.color = "#aaa";
                    this.style.borderColor = "#333";
                }, 2000);
            } catch (error) {
                this.innerText = "COPY FAILED — SELECT KEY MANUALLY";
            }
        }
    );

    // Retain original right-click behavior.
    document.addEventListener("contextmenu", event => {
        event.preventDefault();
    });
</script>
</body>
</html>
