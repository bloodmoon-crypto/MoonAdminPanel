<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protected</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #4f8cff;
    --accent-hover: #3a6fd8; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1a2030, var(--bg) 60%);
    color: var(--text);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    width: 100%; max-width: 360px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .lock {
    width: 44px; height: 44px; border-radius: 12px; background: #232838;
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
    font-size: 22px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: #12151c; color: var(--text);
    font-size: 14px; outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  #err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 18px; }
</style>
</head>
<body>
<form class="box" id="gate" onsubmit="event.preventDefault(); unlock();">
  <div class="lock">🔒</div>
  <h1>Protected Page</h1>
  <p class="sub">Enter the password to unlock this content.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="btn" type="submit">Unlock</button>
  <div id="err" role="alert"></div>
  <div class="foot">AES-256-GCM · PBKDF2</div>
</form>

  function b64ToBuf(b64) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  async function deriveKey(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBuf(DATA.salt), iterations: 200000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock() {
    const pwEl = document.getElementById("pw");
    const btn = document.getElementById("btn");
    const err = document.getElementById("err");
    const pw = pwEl.value;
    err.textContent = "";
    if (!pw) { err.textContent = "Please enter a password."; return; }

    btn.disabled = true;
    btn.textContent = "Unlocking…";
    try {
      const key = await deriveKey(pw);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBuf(DATA.iv) },
        key,
        b64ToBuf(DATA.ct)
      );
      const html = new TextDecoder().decode(plain);

      // ✅ Load decrypted HTML as a REAL document (fresh page load).
      // This makes CSS/JS/UI behave exactly like the original file.
      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      window.location.replace(url);
    } catch (e) {
      err.textContent = "Wrong password or corrupted file.";
      btn.disabled = false;
      btn.textContent = "Unlock";
      pwEl.select();
    }
  }

  window.unlock = unlock; // keep form onsubmit happy
})();
